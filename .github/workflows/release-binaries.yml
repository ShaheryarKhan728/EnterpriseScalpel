name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write # needed to create the release and upload assets

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            archive-name: EnterpriseScalpel-linux-x64.tar.gz

          - os: ubuntu-latest
            rid: linux-arm64
            archive-name: EnterpriseScalpel-linux-arm64.tar.gz

          - os: windows-latest
            rid: win-x64
            archive-name: EnterpriseScalpel-win-x64.zip

          - os: macos-latest
            rid: osx-x64
            archive-name: EnterpriseScalpel-osx-x64.tar.gz

          - os: macos-latest
            rid: osx-arm64
            archive-name: EnterpriseScalpel-osx-arm64.tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Publish to an explicit folder: with -r <rid> the default output is
      # bin/Release/net8/<rid>/publish, which the old archive steps did not use.
      - name: Build and publish
        run: dotnet publish EnterpriseScalpel.csproj -c Release -r ${{ matrix.rid }} --self-contained -o publish

      - name: Create archive (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: tar czf "${{ matrix.archive-name }}" -C publish .

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: 7z a "${{ matrix.archive-name }}" ./publish/*

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.archive-name }}
